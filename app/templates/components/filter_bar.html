<!-- Expects `filters` { zone, status, search, date_from, date_to } and `today` in context -->
<form class="filter-bar" method="get">
  <!-- Row 1: Search, Zone, Status, Time Slot -->
  <div class="filter-row">
    <div class="filter-field filter-field--grow">
      <label class="filter-label" for="filterSearch">Search</label>
      <div class="filter-search-wrapper">
        <span class="material-symbols-outlined filter-search-icon">search</span>
        <input
          class="filter-input filter-input--search"
          type="text"
          id="filterSearch"
          name="search"
          value="{{ filters.search }}"
          placeholder="Search by plate number..."
        />
      </div>
    </div>

    <div class="filter-field filter-field--fixed">
      <label class="filter-label" for="filterZone">Zone</label>
      <select class="filter-select" id="filterZone" name="zone">
        {% for zone in ("All", "Megenagna", "Bole", "Saris", "Asko", "Tor Hailoch") %}
        <option value="{{ zone }}" {{ "selected" if filters.zone is eq zone }}>{{ zone }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="filter-field filter-field--fixed">
      <label class="filter-label" for="filterStatus">Status</label>
      <select class="filter-select" id="filterStatus" name="status">
        {% for status in ("Pending", "Reviewed", "Resolved", "All") %}
        <option value="{{ status }}" {{ "selected" if filters.status is eq status }}>{{ status }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="filter-field filter-field--fixed">
      <label class="filter-label" for="filterTimeSlot">Time Slot</label>
      <select class="filter-select" id="filterTimeSlot" disabled title="Not implemented yet">
        <option>All</option>
        <option>Morning (6AM–12PM)</option>
        <option>Afternoon (12PM–6PM)</option>
        <option>Evening (6PM–12AM)</option>
      </select>
    </div>
  </div>

  <!-- Row 2: Date Preset, From, To, Apply -->
  <div class="filter-row">
    <div class="filter-field filter-field--fixed">
      <label class="filter-label" for="filterDatePreset">Date Preset</label>
      <select class="filter-select" id="filterDatePreset" disabled title="Not implemented yet">
        <option>Today</option>
        <option>This Week</option>
        <option>This Month</option>
        <option>All Time</option>
      </select>
    </div>

    <div class="filter-field filter-field--grow">
      <label class="filter-label" for="filterDateFrom">From</label>
      <input class="filter-input" type="date" id="filterDateFrom" name="date_from" value="{{ filters.date_from }}" max="{{ today }}" />
    </div>

    <div class="filter-field filter-field--grow">
      <label class="filter-label" for="filterDateTo">To</label>
      <input class="filter-input" type="date" id="filterDateTo" name="date_to" value="{{ filters.date_to }}" max="{{ today }}" />
    </div>

    <div class="filter-actions">
      <button class="btn-apply-filter" type="submit">
        <span class="material-symbols-outlined" style="font-size: 18px"
          >filter_list</span
        >
        Apply
      </button>
    </div>
  </div>
</form>
