name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort pytest  # dev tools

      - name: Lint (flake8)
        run: flake8 app/ tests/ --ignore=E302,E501,W292,F401

      - name: Code format check (black)
        run: black --check .

      - name: Import order check (isort)
        run: isort --check-only .

      - name: Run tests
        run: pytest
